<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        // Suppress benign Vite HMR websocket reconnection notices in sandboxed cloud preview
        function isBenign(arg) {
          if (!arg) return false;
          var str = '';
          try {
            str = typeof arg === 'object' ? (arg.message || arg.stack || JSON.stringify(arg) || '') : String(arg);
          } catch(e) {
            str = String(arg);
          }
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1 ||
            str.indexOf('ResizeObserver') !== -1
          );
        }

        var origErr = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isBenign(args[i])) return;
          }
          origErr.apply(console, args);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          for (var i = 0; i < args.length; i++) {
            if (isBenign(args[i])) return;
          }
          origWarn.apply(console, args);
        };

        var origInfo = console.info;
        if (origInfo) {
          console.info = function() {
            var args = Array.prototype.slice.call(arguments);
            for (var i = 0; i < args.length; i++) {
              if (isBenign(args[i])) return;
            }
            origInfo.apply(console, args);
          };
        }

        window.addEventListener('unhandledrejection', function(evt) {
          if (evt && isBenign(evt.reason)) {
            evt.preventDefault();
            evt.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(evt) {
          if (evt && (isBenign(evt.message) || isBenign(evt.error))) {
            evt.preventDefault();
            evt.stopImmediatePropagation();
          }
        });
      })();
    </script>
